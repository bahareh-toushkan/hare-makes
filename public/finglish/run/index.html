<style>
  :root { --bg:#fafaf7; --fg:#1d1d1f; --muted:#666; --accent:#1f5fbf; --box:#fff; --line:#d8d8d0; --warn:#b3261e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: Tahoma, "Vazirmatn", "Noto Naskh Arabic", "Segoe UI", sans-serif; font-size: 18px; line-height: 1.8; }
  #app { max-width: 820px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 10px; }

  .card { background: var(--box); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin: 12px 0; }
  .card ul { margin: 6px 0; padding-right: 20px; }
  button { font: inherit; padding: 10px 22px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; touch-action: manipulation; }
  button.secondary { background: #fff; color: var(--accent); }
  input[type=text], textarea, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; width: 100%; background: #fff; }
  label { display: block; margin: 12px 0 4px; }
  .choice { display: flex; gap: 8px 18px; flex-wrap: wrap; }
  .choice label { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0; }
  .stage { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .fix { font-size: 48px; color: #888; }
  .stim { direction: ltr; font-family: Consolas, "Courier New", monospace; font-size: clamp(26px, 7vw, 40px); letter-spacing: 1px; word-break: break-word; }
  .stim.sent { font-size: clamp(20px, 5.5vw, 30px); }
  .stim .t { font-weight: bold; text-decoration: underline; text-underline-offset: 6px; color: var(--accent); }
  .resp { margin-top: 22px; width: min(420px, 100%); display: flex; gap: 8px; }
  .resp input { font-size: 26px; text-align: center; flex: 1; }
  .opts { direction: ltr; display: flex; gap: clamp(12px, 5vw, 40px); justify-content: center; margin-top: 26px; width: 100%; }
  .opt { border: 2px solid var(--line); border-radius: 10px; padding: 12px 18px; min-width: 130px; flex: 0 1 220px; background: #fff; cursor: pointer; user-select: none; touch-action: manipulation; }
  .opt.sel { border-color: var(--accent); background: #eef3fb; }
  .opt .k { display: block; font-family: Consolas, monospace; font-size: 15px; color: var(--muted); }
  .opt .w { display: block; font-size: clamp(24px, 6vw, 30px); direction: rtl; }
  .conf { display: flex; gap: 6px; justify-content: center; direction: ltr; margin-top: 14px; flex-wrap: nowrap; }
  .conf button { min-width: 0; width: clamp(38px, 11vw, 54px); padding: 10px 0; }
  .scale { direction: ltr; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); width: min(420px, 100%); margin: 6px auto 0; }
  .scale span { direction: rtl; }
  .warn { color: var(--warn); font-size: 15px; min-height: 1.6em; margin-top: 6px; }
  .progress { font-size: 13px; color: var(--muted); margin-top: 18px; }
  .hint { font-size: 14px; color: var(--muted); }
  textarea { min-height: 90px; }
  .mono { direction: ltr; text-align: left; font-family: Consolas, monospace; font-size: 12px; }
  .center { text-align: center; }
  .links { margin-top: 12px; font-size: 16px; }   /* 11/12: 끝 화면 메신저 링크 */
  details.card summary { cursor: pointer; color: var(--muted); font-size: 15px; }   /* 11/12 */
  .card ol { margin: 8px 0; padding-right: 22px; }   /* 11/12 */
</style>

function cleanCode(s) {

    .replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06F0))   // 페르시아 숫자 → 0-9
    .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660))   // 아랍 숫자 → 0-9
    .replace(/[^A-Za-z0-9]/g, "").toUpperCase();
}

// ---------- 결과 코드 만들기 ----------
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function b64url(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function gzipBytes(bytes) {
  if (typeof CompressionStream === "undefined") return null;
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function makeCode(task, pid, csv) {
  const raw = new TextEncoder().encode(csv);
  let z = null;
  try { z = await gzipBytes(raw); } catch (_) { z = null; }
  return (z ? "FG1" : "FG0") + "." + task + "." + pid + "." + raw.length + "." + crc32(raw).toString(16) + "." + b64url(z || raw) + ".END";
}

// ---------- B. 자동 전송 ----------
async function sendResult(meta, code) {
  const body = {
    access_key: CFG.w3fKey,
    subject: "[FG] " + meta.pid + " " + meta.task + " " + CFG.version + " " + meta.device,
    from_name: "Finglish experiment",
    pid: meta.pid, task: meta.task, version: CFG.version, device: meta.device, rows: meta.rows,
    code: code
  };
  let last = "";
  for (let i = 0; i < 3; i++) {                 // 최대 3번
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 25000);
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(body), signal: ctl.signal
      });
      clearTimeout(timer);
      const j = await res.json().catch(() => ({}));
      if (res.ok && j.success) return { ok: true };
      last = "http " + res.status + " " + (j.message || "");
      if (res.status >= 400 && res.status < 500 && res.status !== 429) break;   // 다시 해도 같은 오류
    } catch (e) { last = String((e && e.name) || e); }
    await sleep(1500 * (i + 1));
  }
  return { ok: false, err: last };
}

function download(csv, fname) {
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
}
async function shareFile(csv, fname) {          // 폰: 공유 창(텔레그램·왓츠앱 등) / 안 되면 파일 내려받기
  try {
    const file = new File(["﻿" + csv], fname, { type: "text/csv" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: fname });
      return "shared";
    }
  } catch (e) { if (e && e.name === "AbortError") return "cancel"; }
  download(csv, fname);
  return "downloaded";
}

const COARSE = matchMedia("(pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches;
const DEVICE = COARSE ? (Math.min(screen.width, screen.height) >= 700 ? "tablet" : "phone") : "pc";

// ---------- 페르시아어 정규화 (자동 채점용) ----------
function stripGloss(s) { return String(s || "").replace(/\s*[(（][^)）]*[)）]\s*/g, "").trim(); }
function normFa(s) {
  return stripGloss(s)
    .replace(/[ً-ٰٟـ]/g, "")   // 모음 부호·타트윌 제거
    .replace(/[‌‍\s]/g, "")               // ZWNJ·ZWJ·공백 제거
    .replace(/[يى]/g, "ی").replace(/ك/g, "ک");
}
const HAS_FA = /[؀-ۿ]/;

// ---------- 문장 안 목표 단어 찾기 (단어 경계 기준) ----------
function findTarget(sentence, target) {
  const reEsc = target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  let m = new RegExp("(^|[^A-Za-z0-9'])(" + reEsc + ")(?=$|[^A-Za-z0-9'])", "i").exec(sentence);
  // 11/12: 따로 떨어진 단어가 없으면, 접어가 붙은 형태(mrd → mrde, sr → srm)의 앞부분을 찾는다
  if (!m) m = new RegExp("(^|[^A-Za-z0-9'])(" + reEsc + ")", "i").exec(sentence);
  if (!m) return -1;
  return m.index + m[1].length;
}
function stimHTML(item, ctx) {
  if (ctx && item.ctx) {
    const i = findTarget(item.ctx, item.fin);
    if (i >= 0) {
      const s = item.ctx, L = item.fin.length;
      return `<div class="stim sent">${esc(s.slice(0, i))}<span class="t">${esc(s.slice(i, i + L))}</span>${esc(s.slice(i + L))}</div>`;
    }
  }
  return `<div class="stim"><span class="t">${esc(item.fin)}</span></div>`;
}

// ---------- 조건 배정 (4개 리스트, 역균형) ----------
// 유형별로 문항ID 순 정렬 → i번째 문항의 조건 = (i % 4 + list) % 4
// 0: 자유입력+맥락, 1: 자유입력+맥락없음, 2: 2지선택+맥락, 3: 2지선택+맥락없음
function assign(items, list) {
  const byType = {};
  items.forEach((it) => { (byType[it.type] = byType[it.type] || []).push(it); });
  const out = [];
  Object.keys(byType).sort().forEach((t) => {
    let iSplit = 0, iAfc = 0;   // 일반 문항과 2지 선택 전용 문항을 따로 세어 각각 균형 맞춤
    byType[t].slice().sort((a, b) => a.id.localeCompare(b.id)).forEach((it) => {
      const i = it.afcOnly ? iAfc++ : iSplit++;
      if (it.afcOnly) {
        // 정답·오답 표기가 같은 문항(동형어): 자유 입력으로는 구분이 안 되므로 2지 선택만, 맥락만 역균형
        const c2 = ((i % 2) + list) % 2;
        out.push({ it, fmt: "afc", ctx: c2 === 0 ? 1 : 0 });
      } else {
        const c = ((i % 4) + list) % 4;
        out.push({ it, fmt: c < 2 ? "free" : "afc", ctx: c % 2 === 0 ? 1 : 0 });
      }
    });
  });
  return out;
}

// 11/12: S 는 통째로 브라우저에 저장된다(이어 하기). seq = 화면 순서, pos = 지금 위치

const COLS = ["pid", "list", "version", "device", "block", "phase", "trial", "item_id", "type", "context",
  "target", "correct_reading", "foil", "left", "right", "response", "side", "auto_correct",

    age: S.bg.age || "", region: S.bg.region || "", country: S.bg.country || "", finglish_freq: S.bg.freq || "",

function toCSV() {
  const q = (v) => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [COLS.join(",")].concat(S.rows.map((r) => COLS.map((c) => q(r[c])).join(","))).join("\r\n");

async function freeTrial(it, ctx, phase, n, total) {
  await fixation();
  const prog = phase === "practice" ? "تمرین" : `بخش ۱ — ${fa(n)} از ${fa(total)}`;
  show(`<div class="stage">${stimHTML(it, ctx)}
      <div class="resp"><input id="resp" type="text" dir="rtl" inputmode="text" enterkeyhint="done"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="ok" type="button">ثبت</button></div>
      <div class="warn" id="warn"></div>
      <div class="progress">${prog}</div></div>`);
  const inp = $("#resp");
  inp.focus();
  await nextPaint();
  const t0 = now();
  let tFirst = null, warned = false;
  return new Promise((resolve) => {
    const mark = (e) => { if (tFirst === null) tFirst = evTime(e); };
    const submit = (e, how) => {
      const v = inp.value.trim();
      if (!v) return;
      const isFa = HAS_FA.test(v);
      if (!isFa && !warned) {
        warned = true;
        $("#warn").textContent = "لطفاً با حروف فارسی بنویسید. اگر کیبورد فارسی ندارید، دوباره «ثبت» را بزنید.";
        return;
      }
      const t = evTime(e);
      resolve({ resp: v, rtFirst: tFirst === null ? "" : Math.round(tFirst - t0), rt: Math.round(t - t0), latin: isFa ? 0 : 1, input: how });
    };
    inp.addEventListener("input", mark);
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submit(e, "enter"); return; }
      if (!["Shift", "Alt", "Control", "Meta", "CapsLock", "Tab"].includes(e.key)) mark(e);
    });
    $("#ok").addEventListener("pointerdown", (e) => { e.preventDefault(); submit(e, "button"); });
  });
}

    const onKey = (e) => {
      if (e.repeat) return;
      if (e.code === "KeyF") { e.preventDefault(); finish("L", evTime(e), "key"); }
      else if (e.code === "KeyJ") { e.preventDefault(); finish("R", evTime(e), "key"); }
    };
    document.addEventListener("keydown", onKey);
    $("#oL").addEventListener("pointerdown", (e) => finish("L", evTime(e), "touch"));
    $("#oR").addEventListener("pointerdown", (e) => finish("R", evTime(e), "touch"));
  });
  $(res.side === "L" ? "#oL" : "#oR").classList.add("sel");
  await sleep(150);
  return { left: L, right: R, resp: res.side === "L" ? L : R, side: res.side,
    correct: (res.side === "L") === leftCorrect ? 1 : 0, rt: Math.round(res.t - t0), input: res.how };
}

async function runTrial(spec, phase, n, total, block) {
  const it = spec.it;
  const ctxShown = spec.ctx && it.ctx && findTarget(it.ctx, it.fin) >= 0 ? 1 : 0;
  let r;
  if (block === "free") {
    r = await freeTrial(it, ctxShown, phase, n, total);
    const nr = normFa(r.resp);
    r.correct = nr === normFa(it.cor) ? 1 : (nr === normFa(it.foil) ? 0 : "");
  } else {
    r = await afcTrial(it, ctxShown, phase, n, total);
  }
  const c = await askConfidence();
  S.trial += 1;
  pushRow({ block, phase, trial: S.trial, item_id: it.id, type: it.type, context: ctxShown,
    target: it.fin, correct_reading: it.cor, foil: it.foil, left: r.left || "", right: r.right || "",
    response: r.resp, side: r.side || "", auto_correct: r.correct, rt_first_ms: r.rtFirst ?? "",
    rt_ms: r.rt, input: r.input, confidence: c.conf, conf_rt_ms: c.rt, latin_input: r.latin ?? "" });
  show(`<div class="stage"></div>`);
  await sleep(300);
}

function guard(e) { e.preventDefault(); e.returnValue = ""; }

// ---------- 전체 흐름 ----------
const ITEM = {};
STIM.items.concat(STIM.practice).forEach((it) => { ITEM[it.id] = it; });

// 11/12: 화면 순서를 한 번만 정해서 저장한다 → 창을 닫았다 열어도 같은 순서로 이어진다
function buildSeq(list) {
  const plan = assign(STIM.items, list);
  const mk = (p) => ({ id: p.it.id, ctx: p.ctx });
  const free = shuffle(plan.filter((p) => p.fmt === "free")).map(mk);
  const afc = shuffle(plan.filter((p) => p.fmt === "afc")).map(mk);
  const prac = STIM.practice;
  const pracFree = prac.slice(0, 2).map((it, i) => ({ id: it.id, ctx: i % 2 === 0 ? 1 : 0 }));
  const pracAfc = prac.slice(2, 4).map((it, i) => ({ id: it.id, ctx: i % 2 === 0 ? 1 : 0 }));
  const seq = [];
  const trials = (arr, block, phase) => arr.forEach((t, i) => seq.push({ k: "trial", block, phase, id: t.id, ctx: t.ctx, n: i + 1, total: arr.length }));
  seq.push({ k: "instr", id: "p1", prac: pracFree.length });
  trials(pracFree, "free", "practice");
  if (pracFree.length) seq.push({ k: "instr", id: "p1main", total: free.length });
  trials(free, "free", "main");
  seq.push({ k: "instr", id: "half" });
  seq.push({ k: "instr", id: "p2", prac: pracAfc.length });
  trials(pracAfc, "afc", "practice");
  if (pracAfc.length) seq.push({ k: "instr", id: "p2main", total: afc.length });
  trials(afc, "afc", "main");
  seq.push({ k: "endq" });
  return seq;
}

function instrHTML(st) {
  const isPc = DEVICE === "pc";
  if (st.id === "p1") return `<h1>بخش ۱ — نوشتن</h1>
    هر بار یک کلمه یا جمله‌ی فینگلیش می‌بینید. اگر جمله بود، به کلمه‌ی <b>زیرخط‌دار</b> نگاه کنید.<br>
    همان کلمه را <b>همان‌طور که خواندید، با حروف فارسی</b> بنویسید و ${isPc ? "Enter" : "«ثبت»"} را بزنید.<br>
    سریع جواب بدهید — اولین خوانشی که به ذهنتان می‌رسد. بعد میزان اطمینان را از ۱ تا ۷ ${isPc ? "با کلیدهای عدد" : "لمس کنید"}.
    ${st.prac ? "<br>اول دو مورد تمرینی." : ""}
    <span class="en">Part 1: Type the underlined word in Persian letters exactly as you read it, then ${isPc ? "Enter" : "tap the button"}. Answer quickly. Then rate your confidence 1–7.</span>`;
  if (st.id === "p1main") return `تمرین تمام شد. حالا بخش ۱ اصلی (${fa(st.total)} مورد).<span class="en">Practice done. Main Part 1 starts.</span>`;
  if (st.id === "half") return `<h1>نیمه‌ی راه 🙂</h1>اگر خواستید چند ثانیه استراحت کنید.<span class="en">Halfway. Take a short break if you like.</span>`;
  if (st.id === "p2") return `<h1>بخش ۲ — انتخاب</h1>
    کلمه یا جمله‌ی فینگلیش و <b>دو خوانش</b> می‌بینید. خوانش درست را انتخاب کنید:
    ${isPc ? "گزینه‌ی <b>چپ</b> = کلید <b>F</b>، گزینه‌ی <b>راست</b> = کلید <b>J</b>." : "روی گزینه‌ی درست بزنید."}<br>
    سریع جواب بدهید. بعد میزان اطمینان ۱ تا ۷.
    ${st.prac ? "<br>اول دو مورد تمرینی." : ""}
    <span class="en">Part 2: Choose the correct reading — ${isPc ? "left = F, right = J" : "tap it"}. Answer quickly, then rate confidence 1–7.</span>`;
  return `تمرین تمام شد. حالا بخش ۲ اصلی (${fa(st.total)} مورد).<span class="en">Practice done. Main Part 2 starts.</span>`;
}

async function main() {
  if (!(await screenDevice())) return;
  const pid = await askCode("main", "P23");            // 11/12: 명단에 있는 코드만 통과
  KEY = stateKey("main", pid);
  if (WANT_RESET) clearState(KEY);
  const saved = loadState(KEY);
  if (saved && saved.pid === pid && Array.isArray(saved.seq)) {
    S = saved;                                         // 이어 하기
    if (!S.done) {
      show(`<h1>خوش برگشتید 🙂</h1>
        <div class="card">از همان‌جایی که بودید ادامه می‌دهیم.
        <span class="en">Welcome back. We continue from where you stopped.</span></div>
        <div class="center"><button id="cont">ادامه — Continue</button></div>`);
      await waitClick("#cont");
      pushRow({ block: "meta", phase: "resume", item_id: "resume", response: "pos=" + S.pos });
      persist();
    }
  } else {
    S.pid = pid;
    S.list = (parseInt(/(\d+)/.exec(pid)[1], 10) - 1) % 4;
    S.group = CFG.codes.main[pid];
    await screenConsent();
    await screenBackground();
    S.seq = buildSeq(S.list);
    S.start = new Date().toISOString();
    persist();
  }
  if (!S.done) {
    window.addEventListener("beforeunload", guard);
    while (S.pos < S.seq.length) {
      const st = S.seq[S.pos];
      if (st.k === "instr") await screenInstr(instrHTML(st));
      else if (st.k === "trial") await runTrial({ it: ITEM[st.id], ctx: st.ctx }, st.phase, st.n, st.total, st.block);
      else await screenEndQuestions();
      S.pos += 1;
      persist();                                       // 화면 하나가 끝날 때마다 저장
    }
    const end = new Date();
    S.end = end.toISOString();
    pushRow({ block: "meta", phase: "end", item_id: "session",
      response: `start=${S.start};end=${S.end};duration_s=${Math.round((end - new Date(S.start)) / 1000)};screen=${screen.width}x${screen.height}` });
    S.done = true;
    persist();
  }
  await screenFinish();
}

main();
