<title>آشنایی با کلمه‌ها</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1f; --muted:#666; --accent:#1f5fbf; --box:#fff; --line:#d8d8d0; --warn:#b3261e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: Tahoma, "Vazirmatn", "Noto Naskh Arabic", "Segoe UI", sans-serif; font-size: 18px; line-height: 1.8; }
  #app { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  .en { direction: ltr; text-align: left; color: var(--muted); font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; line-height: 1.5; display: block; }
  .card { background: var(--box); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin: 12px 0; }
  button { font: inherit; padding: 10px 22px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; touch-action: manipulation; }
  button.secondary { background: #fff; color: var(--accent); }
  input[type=text], textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; width: 100%; background: #fff; }
  .stage { min-height: 55vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .word { font-size: clamp(34px, 10vw, 52px); margin: 10px 0 18px; }
  .conf { display: flex; gap: 6px; justify-content: center; direction: ltr; flex-wrap: nowrap; }
  .conf button { width: clamp(40px, 12vw, 58px); padding: 12px 0; }
  .scale { direction: ltr; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); width: min(420px, 100%); margin: 6px auto 0; }
  .scale span { direction: rtl; }
  .progress { font-size: 13px; color: var(--muted); margin-top: 16px; }
  .warn { color: var(--warn); font-size: 15px; min-height: 1.6em; }
  .mono { direction: ltr; text-align: left; font-family: Consolas, monospace; font-size: 12px; min-height: 90px; }
  .center { text-align: center; }
  .en.mono { font-family: Consolas, monospace; font-size: 12px; min-height: 0; }   /* 11/12 */
  label { display: block; margin: 12px 0 4px; }   /* 11/12 */
  .links { margin-top: 12px; font-size: 16px; }   /* 11/12: 끝 화면 메신저 링크 */
  details.card summary { cursor: pointer; color: var(--muted); font-size: 15px; }   /* 11/12 */
  .card ol { margin: 8px 0; padding-right: 22px; }   /* 11/12 */
</style>

        <span class="en">Enter the code Bahareh sent you, e.g. ${esc(example)}</span></label>
      <input id="pid" type="text" dir="ltr" value="${esc(fromUrl)}" autocomplete="off" autocapitalize="characters">
      <div class="warn" id="warn"></div>
    </div>
    <div class="center"><button id="codeok">ادامه — Next</button></div>`);
  return new Promise((resolve) => {
    const go = () => {
      const c = cleanCode($("#pid").value);
      if (codes[c]) { resolve(c); return; }
      $("#warn").textContent = "این کد پیدا نشد. لطفاً دوباره نگاه کنید (مثلاً " + example + "). اگر کد ندارید به بهاره پیام بدهید.";
    };
    $("#codeok").addEventListener("click", go);
    $("#pid").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  });
}
function compLine(group) {            // 동의 화면의 사례 문장 (참가자 유형별)
  return CFG.comp[group] || CFG.comp.ar;
}

// ---------- 이어 하기: 진행 상황을 이 기기 브라우저에 저장 ----------
function stateKey(task, pid) { return "fg:" + task + ":" + pid + ":" + CFG.version; }
function loadState(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (_) { return null; }
}
function saveState(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); return true; } catch (_) { return false; }
}
function clearState(key) { try { localStorage.removeItem(key); } catch (_) {} }
const WANT_RESET = new URLSearchParams(location.search).get("reset") === "1";   // ?reset=1 → 저장된 진행 상황을 지우고 처음부터

// ---------- 결과 코드 만들기 ----------
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function b64url(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function gzipBytes(bytes) {
  if (typeof CompressionStream === "undefined") return null;
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function makeCode(task, pid, csv) {
  const raw = new TextEncoder().encode(csv);
  let z = null;
  try { z = await gzipBytes(raw); } catch (_) { z = null; }
  return (z ? "FG1" : "FG0") + "." + task + "." + pid + "." + raw.length + "." + crc32(raw).toString(16) + "." + b64url(z || raw) + ".END";
}

// ---------- B. 자동 전송 ----------
async function sendResult(meta, code) {
  const body = {
    access_key: CFG.w3fKey,
    subject: "[FG] " + meta.pid + " " + meta.task + " " + CFG.version + " " + meta.device,
    from_name: "Finglish experiment",
    pid: meta.pid, task: meta.task, version: CFG.version, device: meta.device, rows: meta.rows,
    code: code
  };
  let last = "";
  for (let i = 0; i < 3; i++) {                 // 최대 3번
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 25000);
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(body), signal: ctl.signal
      });
      clearTimeout(timer);
      const j = await res.json().catch(() => ({}));
      if (res.ok && j.success) return { ok: true };
      last = "http " + res.status + " " + (j.message || "");
      if (res.status >= 400 && res.status < 500 && res.status !== 429) break;   // 다시 해도 같은 오류
    } catch (e) { last = String((e && e.name) || e); }
    await sleep(1500 * (i + 1));
  }
  return { ok: false, err: last };
}

// ---------- A. 예비 전송 ----------
function download(csv, fname) {
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
}
async function shareFile(csv, fname) {          // 폰: 공유 창(텔레그램·왓츠앱 등) / 안 되면 파일 내려받기
  try {
    const file = new File(["﻿" + csv], fname, { type: "text/csv" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: fname });
      return "shared";
    }
  } catch (e) { if (e && e.name === "AbortError") return "cancel"; }
  download(csv, fname);
  return "downloaded";
}

// ---------- 끝 화면 ----------
// o = { task, pid, device, csv, fname, rows, sent, onSent }
async function finishFlow(o) {
  const code = await makeCode(o.task, o.pid, o.csv);
  const links = [
    CFG.tg ? `<a href="https://t.me/${esc(CFG.tg)}" target="_blank" rel="noopener">تلگرام بهاره</a>` : "",
    CFG.wa ? `<a href="https://wa.me/${esc(CFG.wa)}" target="_blank" rel="noopener">واتس‌اپ بهاره</a>` : "",
    CFG.kakao ? `<a href="${esc(CFG.kakao)}" target="_blank" rel="noopener">کاکائوتاک بهاره</a>` : ""
  ].filter(Boolean).join(" · ");
  const tools = `
    <div class="center"><button id="share">فرستادن فایل نتایج — Send file</button> <button id="copy" class="secondary">کپی کد نتایج — Copy code</button></div>
    <div class="center links">${links}</div>
    <div class="warn center" id="msg"></div>
    <textarea id="raw" class="mono" readonly>${esc(code)}</textarea>`;
  const wire = () => {
    $("#share").addEventListener("click", async () => {
      const r = await shareFile(o.csv, o.fname);
      if (r === "downloaded") $("#msg").textContent = "فایل دانلود شد (" + o.fname + "). لطفاً همین فایل را برای بهاره بفرستید.";
      if (r === "shared") $("#msg").textContent = "ممنون! ✓";
    });
    $("#copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(code); }
      catch (_) { const t = $("#raw"); t.select(); document.execCommand("copy"); }
      $("#msg").textContent = "کپی شد ✓ — حالا در چت بهاره بچسبانید و بفرستید.";
    });
    const retry = $("#retry");
    if (retry) retry.addEventListener("click", trySend);
  };
  const view = (state, err) => {
    if (state === "sending") {
      show(`<h1>در حال ذخیره‌ی نتایج…</h1>
        <div class="card">لطفاً چند ثانیه صبر کنید و صفحه را نبندید.
        <span class="en">Saving your results. Please keep this page open for a few seconds.</span></div>`);
      return;
    }
    if (state === "ok") {
      show(`<h1>تمام شد، خیلی ممنونم! 🙏</h1>
        <div class="card"><b>نتایج شما ذخیره و فرستاده شد ✓</b><br>
          کار دیگری لازم نیست و می‌توانید صفحه را ببندید.
          <span class="en">Your results were saved and sent. Nothing else to do — you can close this page.</span></div>
        <details class="card"><summary>اگر بهاره خبر داد که نتیجه نرسیده است</summary>
          <p>دکمه‌ی «فرستادن فایل نتایج» را بزنید و فایل را برای بهاره بفرستید.
          <span class="en">Only if Bahareh tells you the result did not arrive: send the file.</span></p>${tools}</details>`);
      wire();
      return;
    }
    show(`<h1>آزمایش تمام شد — فقط یک قدم مانده 🙏</h1>
      <div class="card"><b>ارسال خودکار انجام نشد</b> (احتمالاً به خاطر اینترنت). نتایج شما روی همین دستگاه محفوظ است.
        <ol>
          <li>اول «تلاش دوباره» را بزنید. اگر فیلترشکن دارید، یک بار روشن یا خاموش کنید و دوباره بزنید.</li>
          <li>اگر باز هم نشد، «فرستادن فایل نتایج» را بزنید و فایل را در تلگرام یا واتس‌اپ برای بهاره بفرستید.</li>
        </ol>
        <span class="en">Automatic sending failed (probably the connection). Your results are safe on this device.
        1) Press "Try again" (toggle your VPN once if you use one). 2) If it still fails, press "Send file" and send the file to Bahareh.</span>
        <span class="en mono">err: ${esc(err || "")}</span></div>
      <div class="center"><button id="retry">تلاش دوباره — Try again</button></div>${tools}`);
    wire();
  };
  async function trySend() {
    view("sending");
    const r = await sendResult({ pid: o.pid, task: o.task, device: o.device, rows: o.rows }, code);
    if (r.ok) { o.onSent(); view("ok"); } else view("fail", r.err);
  }
  if (o.sent) view("ok"); else await trySend();
}


// 평정할 단어 = 모든 문항의 정답 읽기 + 오답 후보 (중복 제거)
function wordList() {
  const map = new Map();
  STIM.items.forEach((it) => {
    [["correct", it.cor], ["foil", it.foil]].forEach(([role, w]) => {
      if (!w) return;
      const k = w.trim();
      if (!map.has(k)) map.set(k, { word: k, roles: [], ids: [] });   // 11/12: 저장할 수 있게 Set → 배열
      const e = map.get(k);
      if (!e.roles.includes(role)) e.roles.push(role);
      if (!e.ids.includes(it.id)) e.ids.push(it.id);
    });
  });
  return shuffle([...map.values()]);
}

// 11/12: S 는 통째로 브라우저에 저장된다(이어 하기). words = 단어 순서, pos = 지금 위치
let S = { pid: "", group: "", rows: [], words: [], pos: 0, done: false, sent: false };
let KEY = "";
function persist() { if (KEY) saveState(KEY, S); }
const COLS = ["pid", "version", "device", "trial", "word", "role", "item_ids", "rating", "rt_ms", "timestamp"];
function toCSV() {
  const q = (v) => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [COLS.join(",")].concat(S.rows.map((r) => COLS.map((c) => q(r[c])).join(","))).join("\r\n");
}

function rate(word, n, total) {
  const btns = [1, 2, 3, 4, 5, 6, 7].map((k) => `<button class="secondary" data-c="${k}">${k}</button>`).join("");
  show(`<div class="stage">
    <div>این کلمه را در زندگی روزمره چقدر می‌بینید یا می‌شنوید؟</div>
    <div class="word">${esc(word)}</div>
    <div class="conf">${btns}</div>
    <div class="scale"><span>۱ = تقریباً هرگز</span><span>۷ = خیلی زیاد</span></div>
    <div class="progress">${fa(n)} از ${fa(total)}</div></div>`);
  return nextPaint().then(() => {
    const t0 = now();
    return new Promise((resolve) => {
      let done = false;
      const finish = (c, t) => { if (done) return; done = true; document.removeEventListener("keydown", onKey); resolve({ c, rt: Math.round(t - t0) }); };
      const onKey = (e) => { if (e.repeat) return; const m = /^(Digit|Numpad)([1-7])$/.exec(e.code); if (m) { e.preventDefault(); finish(+m[2], evTime(e)); } };
      document.addEventListener("keydown", onKey);
      app.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("pointerdown", (e) => finish(+b.dataset.c, evTime(e))));
    });
  });
}

async function main() {
  const pid = await askCode("fam", "F01");               // 11/12: 명단에 있는 코드만 통과
  KEY = stateKey("fam", pid);
  if (WANT_RESET) clearState(KEY);
  const saved = loadState(KEY);
  if (saved && saved.pid === pid && Array.isArray(saved.words)) {
    S = saved;                                           // 이어 하기
    if (!S.done) {
      show(`<h1>خوش برگشتید 🙂</h1>
        <div class="card">از همان‌جایی که بودید ادامه می‌دهیم.
        <span class="en">Welcome back. We continue from where you stopped.</span></div>
        <div class="center"><button id="go">ادامه — Continue</button></div>`);
      await new Promise((r) => $("#go").addEventListener("click", r, { once: true }));
    }
  } else {
    S.pid = pid;
    S.group = CFG.codes.fam[pid];
    const comp = compLine(S.group);
    show(`<h1>کلمه‌ها چقدر آشنا هستند؟</h1>
      <div class="card">
        برای پایان‌نامه‌ی کارشناسی ${esc(CFG.researcherFa)} (دانشگاه ملی سئول). حدود ۱۰ دقیقه.<br>
        هر بار یک کلمه‌ی فارسی می‌بینید. بزنید که این کلمه را در زندگی روزمره چقدر می‌بینید یا می‌شنوید (۱ تا ۷). جواب درست و غلط ندارد.<br>
        این پژوهش را کمیته‌ی اخلاق پژوهشی (IRB) بررسی نکرده و داده‌ها فقط برای پایان‌نامه استفاده می‌شوند. نام یا شماره در نتایج ثبت نمی‌شود؛ فقط کد شما (${esc(pid)}). در پایان، نتایج به‌صورت خودکار از طریق سرویس Web3Forms به ایمیل دانشگاهی پژوهشگر فرستاده می‌شود. هر وقت خواستید می‌توانید ببندید.<br>
        ${esc(comp.fa)}
        <span class="en">Undergraduate thesis (SNU), ~10 min. Rate how often you see or hear each Persian word in daily life (1–7). Not IRB-reviewed; thesis use only; no name recorded in the results, only your code; results are sent automatically to the researcher's university email through Web3Forms; voluntary. ${esc(comp.en)}</span>
      </div>
      <div class="center"><button id="go">موافقم و شروع — I agree, start</button></div>`);
    await new Promise((r) => $("#go").addEventListener("click", r, { once: true }));
    S.words = wordList();
    persist();
  }
  while (S.pos < S.words.length) {
    const w = S.words[S.pos];
    const r = await rate(w.word, S.pos + 1, S.words.length);
    S.rows.push({ pid: S.pid, version: CFG.version, device: DEVICE, trial: S.pos + 1, word: w.word,
      role: w.roles.join("|"), item_ids: w.ids.join("|"), rating: r.c, rt_ms: r.rt, timestamp: new Date().toISOString() });
    S.pos += 1;
    persist();                                           // 단어 하나가 끝날 때마다 저장
    await sleep(200);
  }
  if (!S.done) { S.done = true; S.end = new Date().toISOString(); persist(); }
  const end = new Date(S.end);
  const pad = (n) => String(n).padStart(2, "0");
  const fname = `familiarity_${S.pid}_${end.getFullYear()}${pad(end.getMonth() + 1)}${pad(end.getDate())}-${pad(end.getHours())}${pad(end.getMinutes())}.csv`;
  // 11/12: 자동 전송(Web3Forms) → 안 되면 파일·코드 예비 전송. 자세한 것은 common_save.js
  await finishFlow({ task: "fam", pid: S.pid, device: DEVICE, csv: toCSV(), fname, rows: S.rows.length, sent: S.sent,
    onSent: () => { S.sent = true; persist(); } });
}
main();
</script>
