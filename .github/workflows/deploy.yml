# main 브랜치에 푸시하면 빌드해서 GitHub Pages에 배포한다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번 바꿔 둬야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build
        # 사용자 도메인을 연결하면 origin이 그 도메인으로, base_path는 ""로 자동으로 바뀐다
        # 인증서 발급 전에는 origin이 http://로 나오므로 canonical·OG·sitemap은 항상 https://로 고정 (변경)
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx --no-install astro build --site "${ORIGIN/#http:/https:}" --base "${BASE_PATH}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
